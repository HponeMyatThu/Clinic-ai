[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcms-ai-backend"
version = "0.1.0"
description = "GCMS Clinical AI Backend — Terminology Search & AI-Assisted Clinical Decision Support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.13.0,<2.0",
    # Validation & settings
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
    # AI / Ollama
    "httpx>=0.27.0,<1.0",
    # Redis (caching & background jobs)
    "redis[hiredis]>=5.0.0,<6.0",
    # Security
    "python-jose[cryptography]>=3.3.0,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    # Utilities
    "tenacity>=8.3.0,<10.0",
    "structlog>=24.1.0,<25.0",
    "python-multipart>=0.0.9",
    "orjson>=3.10.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-cov>=5.0.0,<6.0",
    "httpx>=0.27.0,<1.0",
    "factory-boy>=3.3.0,<4.0",
    "ruff>=0.4.0,<1.0",
    "mypy>=1.10.0,<2.0",
    "pre-commit>=3.7.0,<4.0",
    "aiosqlite>=0.20.0,<1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

